basePath: /
definitions:
  handler.CancelOrderResponse:
    properties:
      item:
        $ref: '#/definitions/handler.OrderItem'
    type: object
  handler.CreateOrderRequest:
    properties:
      car_id:
        type: integer
    type: object
  handler.CreateOrderResponse:
    properties:
      id:
        type: integer
      message:
        type: string
      status:
        enum:
        - pending
        - confirmed
        - failed
        example: confirmed
        type: string
    type: object
  handler.DeleteOrderResponse:
    properties:
      message:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.GetOrderResponse:
    properties:
      item:
        $ref: '#/definitions/handler.OrderItem'
    type: object
  handler.GetOrdersResponse:
    properties:
      hasNext:
        type: boolean
      items:
        items:
          $ref: '#/definitions/handler.OrderItem'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handler.OrderItem:
    properties:
      car_name:
        type: string
      id:
        type: integer
      price_cents:
        type: integer
      status:
        enum:
        - pending
        - confirmed
        - failed
        - cancelled
        example: confirmed
        type: string
      user_name:
        type: string
    type: object
  handler.UpdateOrderRequest:
    properties:
      car_name:
        type: string
      price_cents:
        type: integer
    type: object
  handler.UpdateOrderResponse:
    properties:
      item:
        $ref: '#/definitions/handler.OrderItem'
    type: object
host: localhost:8081
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample order server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go Backend Example API
  version: "1.0"
paths:
  /orders:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of orders. Requires Admin role.
      parameters:
      - description: field to sort by (car_id, user_id, created_at); unknown values
          fall back to created_at
        in: query
        name: orderBy
        type: string
      - description: sort direction (asc, desc); unknown values fall back to asc
        in: query
        name: sortIn
        type: string
      - description: comma-separated car IDs to filter
        in: query
        name: car_ids
        type: string
      - description: page number
        in: query
        name: page
        type: integer
      - description: items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GetOrdersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: 'Places an order for a car and reserves the car for it in car-service.
        201 means a new order was created and confirmed. 200 means the customer already
        had a live order for this car, so this request was a retry: the existing order
        is returned, and completed first if it was still pending. 409 means the car
        is not available. 503 means the order exists but car-service could not confirm
        the reservation yet; it stays pending, and repeating the request completes
        it.'
      parameters:
      - description: Order Payload
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/handler.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CreateOrderResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new order
      tags:
      - orders
  /orders/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an order by ID (Admin only).
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.DeleteOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an order
      tags:
      - orders
    get:
      consumes:
      - application/json
      description: Returns a single order. Admins can view any order; customers can
        view their own orders.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GetOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an order by ID
      tags:
      - orders
    patch:
      consumes:
      - application/json
      description: Updates an order's fields (Admin only).
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Order update payload
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UpdateOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an order
      tags:
      - orders
  /orders/{id}/cancel:
    post:
      consumes:
      - application/json
      description: 'Cancels a pending or confirmed order and releases its car in car-service
        (Admin only). Repeating the request for an order that is already cancelled
        returns 200 with the order. 409 means the order is failed (nothing to cancel),
        car-service refused to release the car, or the order changed while the request
        was running. 503 means car-service could not confirm the release: the order
        is unchanged and the request can be repeated.'
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CancelOrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel an order
      tags:
      - orders
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and then your token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
