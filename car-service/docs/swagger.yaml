basePath: /
definitions:
  handler.CarItem:
    properties:
      id:
        type: integer
      name:
        type: string
      price_cents:
        type: integer
    type: object
  handler.CreateCarRequest:
    properties:
      name:
        example: Car Name
        maxLength: 100
        minLength: 2
        type: string
      price_cents:
        example: 12000
        type: integer
    required:
    - name
    type: object
  handler.CreateCarResponse:
    properties:
      item:
        $ref: '#/definitions/handler.CarItem'
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.GetCarResponse:
    properties:
      item:
        $ref: '#/definitions/handler.CarItem'
    type: object
  handler.GetCarsResponse:
    properties:
      hasNext:
        type: boolean
      items:
        items:
          $ref: '#/definitions/handler.CarItem'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handler.UpdateCarRequest:
    properties:
      name:
        example: Car Name
        maxLength: 100
        minLength: 2
        type: string
      price_cents:
        example: 12000
        type: integer
    type: object
  handler.UpdateCarResponse:
    properties:
      item:
        $ref: '#/definitions/handler.CarItem'
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample car ordering server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go Backend Example API
  version: "1.0"
paths:
  /cars:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of cars with optional filtering and sorting.
      parameters:
      - description: field to sort by (name, price_cents)
        in: query
        name: orderBy
        type: string
      - description: sort direction (asc, desc)
        in: query
        name: sortIn
        type: string
      - description: filter by car name (partial match)
        in: query
        name: name
        type: string
      - description: minimum price in cents
        in: query
        name: minPrice
        type: integer
      - description: maximum price in cents
        in: query
        name: maxPrice
        type: integer
      - description: page number
        in: query
        name: page
        type: integer
      - description: items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GetCarsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List cars
      tags:
      - cars
    post:
      consumes:
      - application/json
      description: Creates a new car (Admin only).
      parameters:
      - description: Car payload
        in: body
        name: car
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCarRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateCarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a car
      tags:
      - cars
  /cars/{id}:
    get:
      consumes:
      - application/json
      description: Returns a single car.
      parameters:
      - description: Car ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.GetCarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get a car by ID
      tags:
      - cars
    patch:
      consumes:
      - application/json
      description: Updates car fields (Admin only).
      parameters:
      - description: Car ID
        in: path
        name: id
        required: true
        type: integer
      - description: Car update payload
        in: body
        name: car
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateCarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UpdateCarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a car
      tags:
      - cars
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and then your token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
