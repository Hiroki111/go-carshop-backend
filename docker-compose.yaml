name: go-carshop-backend

services:
  car-service:
    container_name: car-service
    build:
      context: ./car-service
    env_file:
      - ./car-service/.env
    image: car-service:local
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=car-service-db
      - REDIS_HOST=redis
      - PUBLIC_KEY_PATH=/app/keys/public.pem
    volumes:
      - ./car-service/keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      car-service-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    container_name: order-service
    build:
      context: ./order-service
    env_file:
      - ./order-service/.env
    image: order-service:local
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=order-service-db
      - DB_PORT=5432
      - CAR_SERVICE_URL=http://car-service:8080
      - USER_SERVICE_URL=http://user-service:8082
      - PUBLIC_KEY_PATH=/app/keys/public.pem
    volumes:
      - ./order-service/keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      order-service-db:
        condition: service_healthy
      car-service:
        condition: service_started
      user-service:
        condition: service_started

  user-service:
    container_name: user-service
    build:
      context: ./user-service
    env_file:
      - ./user-service/.env
    image: user-service:local
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=user-service-db
      - DB_PORT=5432
      - PRIVATE_KEY_PATH=/app/keys/private.pem
    volumes:
      - ./user-service/keys/private.pem:/app/keys/private.pem:ro
    depends_on:
      user-service-db:
        condition: service_healthy

  car-service-db:
    image: postgres:18.1
    container_name: car-service-db
    environment:
      POSTGRES_USER: car_service_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: car_service
    ports:
      - "5432:5432"
    volumes:
      - car_service_postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_service_user -d car_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service-db:
    image: postgres:18.1
    container_name: order-service-db
    environment:
      POSTGRES_USER: order_service_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_service
    ports:
      - "5433:5432"
    volumes:
      - order_service_postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service_user -d order_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service-db:
    image: postgres:18.1
    container_name: user-service-db
    environment:
      POSTGRES_USER: user_service_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_service
    ports:
      - "5434:5432"
    volumes:
      - user_service_postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service_user -d user_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0
    container_name: car-service-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Message broker for the events between order-service and message-service.
  # One node that is both broker and controller (KRaft mode, no ZooKeeper).
  # Clients need an address that works from where they run, so the broker has
  # two listeners and advertises a different address on each:
  #   - containers in this Compose project use kafka:9092
  #   - programs started on your own machine use localhost:29092
  # The controller listener is only used by the broker itself.
  kafka:
    image: apache/kafka:4.2.2
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Runs once, creates the topics and exits. The broker keeps its data inside
  # the container only, so `docker compose down` removes the topics and the
  # next `up` creates them again.
  kafka-init:
    image: apache/kafka:4.2.2
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic orders --partitions 3 --replication-factor 1

  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:12.3
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  car_service_postgres_data:
  order_service_postgres_data:
  user_service_postgres_data:
  redis_data:
  grafana_data: